services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reclaimai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reclaimai_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-reclaimai}
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ./infra/k8s/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaimai -d reclaimai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - demo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://redpanda:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://redpanda:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
    volumes:
      - demo-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 10s
      retries: 10

  pos-integration-service:
    build:
      context: .
      dockerfile: apps/pos-integration-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclaimai}:${POSTGRES_PASSWORD:-reclaimai_demo_password}@postgres:5432/${POSTGRES_DB:-reclaimai}
      PORT: 3002
      CLAIM_WEB_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8088}
      KAFKA_CLIENT_ID: pos-integration-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  identity-resolution-service:
    build:
      context: .
      dockerfile: apps/identity-resolution-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclaimai}:${POSTGRES_PASSWORD:-reclaimai_demo_password}@postgres:5432/${POSTGRES_DB:-reclaimai}
      PORT: 8001
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8088}
      KAFKA_CLIENT_ID: identity-resolution-service
      OTP_PROVIDER: ${OTP_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL:-ReclaimAI Demo <onboarding@resend.dev>}
      # Portfolio demo: RazorpayX test-mode API (real HTTP + webhooks, no live money)
      RAZORPAYX_MOCK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  margin-offer-engine:
    build:
      context: .
      dockerfile: apps/margin-offer-engine/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclaimai}:${POSTGRES_PASSWORD:-reclaimai_demo_password}@postgres:5432/${POSTGRES_DB:-reclaimai}
      PORT: 8002
      CLAIM_WEB_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      KAFKA_CLIENT_ID: margin-offer-engine
      KAFKA_CONSUMER_GROUP: margin-offer-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  copy-llm-orchestrator:
    build:
      context: .
      dockerfile: apps/copy-llm-orchestrator/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclaimai}:${POSTGRES_PASSWORD:-reclaimai_demo_password}@postgres:5432/${POSTGRES_DB:-reclaimai}
      PORT: 8004
      CLAIM_WEB_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      KAFKA_CLIENT_ID: copy-llm-orchestrator
      KAFKA_CONSUMER_GROUP: copy-llm-orchestrator
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DAILY_TOKEN_BUDGET: ${ANTHROPIC_DAILY_TOKEN_BUDGET:-100000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  whatsapp-dispatch-service:
    build:
      context: .
      dockerfile: apps/whatsapp-dispatch-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclaimai}:${POSTGRES_PASSWORD:-reclaimai_demo_password}@postgres:5432/${POSTGRES_DB:-reclaimai}
      PORT: 3003
      KAFKA_CLIENT_ID: whatsapp-dispatch-service
      KAFKA_GROUP_ID: whatsapp-dispatch-service
      # Portfolio demo: real Meta Cloud API only (no in-process mock; Gupshup not required)
      WHATSAPP_MOCK: "false"
      WHATSAPP_SEND_MODE: template
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  tenant-auth-service:
    build:
      context: .
      dockerfile: apps/tenant-auth-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclaimai}:${POSTGRES_PASSWORD:-reclaimai_demo_password}@postgres:5432/${POSTGRES_DB:-reclaimai}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8088}
      APP_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}/dashboard
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  claim-web:
    build:
      context: .
      dockerfile: apps/claim-web/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      PORT: 3101
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_IDENTITY_API_URL: /api/identity
      NEXT_PUBLIC_POS_API_URL: /api/pos
    depends_on:
      identity-resolution-service:
        condition: service_healthy
      pos-integration-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  dashboard-web:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /dashboard
        NEXT_PUBLIC_TENANT_AUTH_URL: /api/tenant-auth
        NEXT_PUBLIC_AUTH_DEV_BYPASS: ${NEXT_PUBLIC_AUTH_DEV_BYPASS:-false}
        NEXT_PUBLIC_AUTH0_DOMAIN: ${NEXT_PUBLIC_AUTH0_DOMAIN:-}
        NEXT_PUBLIC_AUTH0_CLIENT_ID: ${NEXT_PUBLIC_AUTH0_CLIENT_ID:-}
        NEXT_PUBLIC_AUTH0_AUDIENCE: ${NEXT_PUBLIC_AUTH0_AUDIENCE:-https://api.reclaimai.demo}
        NEXT_PUBLIC_AUTH0_CALLBACK_URL: ${NEXT_PUBLIC_AUTH0_CALLBACK_URL:-http://localhost:8088/dashboard}
    restart: unless-stopped
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo.example}
    environment:
      PORT: 3100
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BASE_PATH: /dashboard
      NEXT_PUBLIC_TENANT_AUTH_URL: /api/tenant-auth
      NEXT_PUBLIC_AUTH_DEV_BYPASS: ${NEXT_PUBLIC_AUTH_DEV_BYPASS:-false}
    depends_on:
      tenant-auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/dashboard').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  reverse-proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      claim-web:
        condition: service_healthy
      dashboard-web:
        condition: service_healthy
      pos-integration-service:
        condition: service_healthy
      identity-resolution-service:
        condition: service_healthy
      margin-offer-engine:
        condition: service_healthy
      copy-llm-orchestrator:
        condition: service_healthy
      whatsapp-dispatch-service:
        condition: service_healthy
      tenant-auth-service:
        condition: service_healthy
    ports:
      - "${DEMO_HTTP_PORT:-8088}:80"
    volumes:
      - ./infra/demo/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  demo-postgres-data: {}
  demo-redis-data: {}
  demo-redpanda-data: {}
