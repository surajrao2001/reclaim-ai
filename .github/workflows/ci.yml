name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspace=@reclaimai/shared-types --workspace=@reclaimai/shared-auth

  python:
    name: Python lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - identity-resolution-service
          - margin-offer-engine
          - decay-prediction-service
          - copy-llm-orchestrator
          - analytics-service
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
