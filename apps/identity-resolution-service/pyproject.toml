[project]
name = "identity-resolution-service"
version = "0.1.0"
description = "Phone-number unmasking and customer profile merge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "structlog>=24.4.0",
  "httpx>=0.28.1",
  "asyncpg>=0.30.0",
  "redis>=5.2.1",
  "aiosmtplib>=3.0.2",
  "pyjwt>=2.10.1",
  "aiokafka>=0.12.0",
  "phonenumbers>=8.13.52",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.0", "ruff>=0.8.4", "mypy>=1.14.0"]

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
