[project]
name = "identity-resolution-service"
version = "0.1.0"
description = "Phone-number unmasking and customer profile merge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "structlog>=24.4.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "ruff>=0.8.4", "mypy>=1.14.0"]

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
