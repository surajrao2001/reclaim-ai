# POS Integration Python sidecar worker
# Handles heavy transform / sticker rendering jobs off the Nest request path.

[project]
name = "pos-integration-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "structlog>=24.4.0",
  "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"
